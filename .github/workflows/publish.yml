name: Sync & Publish Versions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  css-lint:
    uses: ./.github/workflows/css-lint.yml

  javascript-code-quality:
    uses: ./.github/workflows/javascript-code-quality.yml

  php-code-quality:
    uses: ./.github/workflows/php-code-quality.yml

  shell-code-quality:
    uses: ./.github/workflows/shell-code-quality.yml

  validate-sql:
    needs: [css-lint, javascript-code-quality, php-code-quality, shell-code-quality]
    uses: ./.github/workflows/validate-sql.yml

  publish-version:
    needs: [validate-sql]
    uses: ./.github/workflows/publish-version-json.yml
    permissions:
      contents: write

  release:
    needs: [validate-sql]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm install

      - name: Get version
        id: version
        run: echo "VERSION=$(cat version_static.txt)" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(cat version_static.txt)"
          
          # Check if release already exists
          if gh release view "$TAG_NAME" --repo ${{ github.repository }} 2>/dev/null; then
            echo "Release $TAG_NAME already exists. Deleting..."
            gh release delete "$TAG_NAME" --repo ${{ github.repository }} --yes
          fi
          
          # Create new release
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes "Release $TAG_NAME of tt-rss-non-dockerize" \
            --repo ${{ github.repository }}
          
          echo "RELEASE_URL=https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME" >> $GITHUB_OUTPUT
          echo "UPLOAD_URL=https://uploads.github.com/repos/${{ github.repository }}/releases/$(gh release view "$TAG_NAME" --json id --jq .id)/assets" >> $GITHUB_OUTPUT

      - name: Create release artifacts
        run: |
          mkdir -p dist
          
          # Save version to variable
          VERSION=$(cat version_static.txt)
          
          # Create tar.gz (archive first, then move to dist)
          tar -czf "/tmp/tt-rss-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.changeset' \
            --exclude='tests' \
            --exclude='tests_functional' \
            --exclude='tests_integration' \
            --exclude='node_modules' \
            --exclude='cache/*' \
            --exclude='*.log' \
            --exclude='.phpunit*' \
            --exclude='phpstan.neon' \
            --exclude='rector.php' \
            --exclude='package-lock.json' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            .
          mv "/tmp/tt-rss-${VERSION}.tar.gz" dist/
          
          # Create zip (archive first, then move to dist)
          zip -r "/tmp/tt-rss-${VERSION}.zip" . \
            -x '.git/*' \
            -x '.github/*' \
            -x '.changeset/*' \
            -x 'tests/*' \
            -x 'tests_functional/*' \
            -x 'tests_integration/*' \
            -x 'node_modules/*' \
            -x 'cache/*' \
            -x '*.log' \
            -x '.phpunit*' \
            -x 'phpstan.neon' \
            -x 'rector.php' \
            -x 'package-lock.json' \
            -x '.gitignore' \
            -x '.gitattributes'
          mv "/tmp/tt-rss-${VERSION}.zip" dist/
          
          echo "Artifacts created:"
          ls -la dist/

      - name: Upload tar.gz artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(cat version_static.txt)"
          gh release upload "$TAG_NAME" "dist/tt-rss-$(cat version_static.txt).tar.gz" --repo ${{ github.repository }}

      - name: Upload zip artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(cat version_static.txt)"
          gh release upload "$TAG_NAME" "dist/tt-rss-$(cat version_static.txt).zip" --repo ${{ github.repository }}
