name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Create release artifacts
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF#refs/tags/v}"
          
          if [ -z "$VERSION" ] || [ "$VERSION" = "${GITHUB_REF}" ]; then
            echo "Not a tag release, skipping artifacts"
            exit 0
          fi
          
          # Create tar.gz (excluding vendor and node_modules)
          tar -czf "/tmp/tt-rss-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.changeset' \
            --exclude='tests' \
            --exclude='tests_functional' \
            --exclude='tests_integration' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='cache/*' \
            --exclude='*.log' \
            --exclude='.phpunit*' \
            --exclude='phpstan.neon' \
            --exclude='rector.php' \
            --exclude='package-lock.json' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='lib/dojo' \
            --exclude='lib/dijit' \
            .
          mv "/tmp/tt-rss-${VERSION}.tar.gz" dist/
          
          # Create zip (excluding vendor and node_modules)
          zip -r "/tmp/tt-rss-${VERSION}.zip" . \
            -x '.git/*' \
            -x '.github/*' \
            -x '.changeset/*' \
            -x 'tests/*' \
            -x 'tests_functional/*' \
            -x 'tests_integration/*' \
            -x 'node_modules/*' \
            -x 'vendor/*' \
            -x 'cache/*' \
            -x '*.log' \
            -x '.phpunit*' \
            -x 'phpstan.neon' \
            -x 'rector.php' \
            -x 'package-lock.json' \
            -x '.gitignore' \
            -x '.gitattributes' \
            -x 'lib/dojo/*' \
            -x 'lib/dijit/*' \
            -x 'lib/dojox/*' \
            -x 'themes/dijit/*' \
            .
          mv "/tmp/tt-rss-${VERSION}.zip" dist/
          
          echo "Created artifacts:"
          ls -la dist/

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG_NAME="v${VERSION}"
          
          gh release upload "$TAG_NAME" "dist/tt-rss-${VERSION}.tar.gz" --repo ${{ github.repository }}
          gh release upload "$TAG_NAME" "dist/tt-rss-${VERSION}.zip" --repo ${{ github.repository }}

      - name: Changesets
        uses: changesets/action@v1.9.0
        with:
          publish: npm ci && npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}