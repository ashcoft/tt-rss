name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

      - name: Get version from tag
        id: version
        if: steps.semantic-release.outputs.release_created == 'true'
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Checkout tag for assets
        if: steps.semantic-release.outputs.release_created == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refs/tags/${{ steps.version.outputs.VERSION }}
          sparse-checkout: |
            *
          sparse-checkout-cone-mode: false

      - name: Install zip
        if: steps.semantic-release.outputs.release_created == 'true'
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Create tar.gz
        if: steps.semantic-release.outputs.release_created == 'true'
        run: tar --exclude='.git' --exclude='.github' -czf tt-rss-${{ steps.version.outputs.VERSION }}-complete.tar.gz .

      - name: Create zip
        if: steps.semantic-release.outputs.release_created == 'true'
        run: zip -r tt-rss-${{ steps.version.outputs.VERSION }}-complete.zip . -x '.git/*' -x '.github/*'

      - name: Upload Release Assets
        if: steps.semantic-release.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          files: |
            tt-rss-${{ steps.version.outputs.VERSION }}-complete.tar.gz
            tt-rss-${{ steps.version.outputs.VERSION }}-complete.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
