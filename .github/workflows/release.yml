name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Check for changeset files and determine version bump
  release-preview:
    name: Release Preview
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.check_changesets.outputs.has_changesets }}
      version_type: ${{ steps.version_type.outputs.type }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for changeset files
        id: check_changesets
        run: |
          if ls .changeset/*.md 2>/dev/null | head -1 | grep -q .; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
            echo "Found changeset files"
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No changeset files found"
          fi

      - name: Determine version type
        id: version_type
        run: |
          # Default to patch
          echo "type=patch" >> $GITHUB_OUTPUT
          
          # Check changeset files for bump type
          if ls .changeset/*.md 2>/dev/null | head -1 | grep -q .; then
            CHANGESET=$(ls .changeset/*.md | head -1)
            if grep -q "major" "$CHANGESET"; then
              echo "type=major" >> $GITHUB_OUTPUT
              echo "Detected major bump from changeset"
            elif grep -q "minor" "$CHANGESET"; then
              echo "type=minor" >> $GITHUB_OUTPUT
              echo "Detected minor bump from changeset"
            fi
          fi

  # Notify when no release needed
  no-release:
    name: No Changesets
    runs-on: ubuntu-latest
    if: always() && needs.release-preview.outputs.has_changesets == 'false'
    steps:
      - name: No release needed
        run: |
          echo "No changeset files found. No release will be created."
          echo ""
          echo "To create a release, add a changeset file to .changeset/"
          echo ""
          echo "Example:"
          echo '  echo "---" > .changeset/my-change.md'
          echo '  echo \'"tt-rss-non-dockerize": patch\' >> .changeset/my-change.md'
          echo '  echo "" >> .changeset/my-change.md'
          echo '  echo "Your change description" >> .changeset/my-change.md'

  # Create release artifacts
  create-release:
    name: Create Release
    needs: release-preview
    if: needs.release-preview.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current_version
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/v//' || echo "0.0.0")
          echo "CURRENT_VERSION=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"

      - name: Calculate new version
        id: new_version
        run: |
          # Get bump type from release-preview
          BUMP_TYPE="${{ needs.release-preview.outputs.version_type }}"
          echo "BUMP_TYPE=$BUMP_TYPE" >> $GITHUB_OUTPUT
          
          # Parse current version
          CURRENT_VER="${{ steps.current_version.outputs.CURRENT_VERSION }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VER"
          
          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0
              ;;
            patch|*)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version will be: $NEW_VERSION (${BUMP_TYPE} bump)"

      - name: Create release artifacts
        run: |
          mkdir -p dist
          VERSION="${{ steps.new_version.outputs.VERSION }}"
          
          # Create tar.gz
          tar -czf "/tmp/tt-rss-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.changeset' \
            --exclude='tests' \
            --exclude='tests_functional' \
            --exclude='tests_integration' \
            --exclude='node_modules' \
            --exclude='cache/*' \
            --exclude='*.log' \
            --exclude='.phpunit*' \
            --exclude='phpstan.neon' \
            --exclude='rector.php' \
            --exclude='package-lock.json' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            .
          mv "/tmp/tt-rss-${VERSION}.tar.gz" dist/
          
          # Create zip
          zip -r "/tmp/tt-rss-${VERSION}.zip" . \
            -x '.git/*' \
            -x '.github/*' \
            -x '.changeset/*' \
            -x 'tests/*' \
            -x 'tests_functional/*' \
            -x 'tests_integration/*' \
            -x 'node_modules/*' \
            -x 'cache/*' \
            -x '*.log' \
            -x '.phpunit*' \
            -x 'phpstan.neon' \
            -x 'rector.php' \
            -x 'package-lock.json' \
            -x '.gitignore' \
            -x '.gitattributes'
          mv "/tmp/tt-rss-${VERSION}.zip" dist/
          
          echo "Created artifacts:"
          ls -la dist/

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage all changes (including changeset files)
          git add -A
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: release v${{ steps.new_version.outputs.VERSION }}"
            git push
            echo "Committed version bump"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${{ steps.new_version.outputs.VERSION }}"
          TAG_NAME="v${VERSION}"
          
          # Generate release notes from commits
          RELEASE_NOTES=$(git log --oneline -20 | head -10 | sed 's/^[a-f0-9]* /- /')
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo 'main')
          
          # Create release notes using printf
          printf '## What'\''s Changed\n\n%s\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
            "$RELEASE_NOTES" "$REPO" "$PREV_TAG" "$TAG_NAME" > /tmp/release_notes.md
          
          # Create release
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes-file /tmp/release_notes.md \
            --repo "${REPO}"

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.new_version.outputs.VERSION }}"
          TAG_NAME="v${VERSION}"
          
          # Upload tar.gz
          gh release upload "$TAG_NAME" "dist/tt-rss-${VERSION}.tar.gz" --repo ${{ github.repository }}
          
          # Upload zip
          gh release upload "$TAG_NAME" "dist/tt-rss-${VERSION}.zip" --repo ${{ github.repository }}

      - name: Delete consumed changeset files
        run: |
          rm -f .changeset/*.md
          git add -A
          git commit -m "chore: clean up consumed changesets" || true
          git push || true