<!DOCTYPE html>
<!--
  Tiny Tiny RSS - Vite Development Entry Point
  
  This file serves as the entry point for Vite's development server.
  In production, the PHP backend serves the original index.php which
  includes the Dojo build system.
  
  This index.html is only used during development with `npm run dev`.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Tiny RSS - Development</title>
    
    <!-- Preconnect to font sources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    
    <!-- Load Dojo CSS (required for dijit widgets) -->
    <link rel="stylesheet" href="/lib/dijit/themes/tt-rss/tt-rss.css">
    <link rel="stylesheet" href="/lib/flat-ttrss/flat_combined.css">
    
    <!-- Fallback theme CSS (loaded by App.js based on user preferences) -->
    <link id="theme_css" rel="stylesheet" href="/themes/light.css">
</head>
<body class="css_loading">
    <!-- Application container -->
    <div id="app"></div>
    
    <!-- Loading indicator shown during app initialization -->
    <div id="loading" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
        <img src="/lib/flat-ttrss/images/loadingAnimation.gif" alt="Loading...">
        <p>Loading Tiny Tiny RSS...</p>
    </div>
    
    <!-- Notification container -->
    <div id="notify" class="notify"></div>
    
    <!-- Main application scripts -->
    <!-- 
      These scripts are loaded in order:
      1. common.js - Utility functions and polyfills
      2. tt-rss.js - Main Dojo application entry point
    -->
    <script type="module" src="/js/common.js"></script>
    <script type="module" src="/js/tt-rss.js"></script>
    
    <!-- 
      Development note:
      In Vite dev mode, these modules will be processed and HMR will be enabled.
      The original Dojo AMD loader is replaced with Vite's module system.
      For production builds, use the original PHP-served pages.
    -->
</body>
</html>
